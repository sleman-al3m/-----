<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nightfall — Sleep Mode</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="noise"></div>
  <main class="app">
    <section class="hero">
      <div class="orb"></div>
      <div class="eyebrow">NIGHTFALL / PRIVATE ROOM</div>
      <h1>وضع النوم</h1>
      <p class="subtitle">هدوء الآن. واستيقاظ عندما يقرر صديقك ذلك.</p>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tab active" data-role="sleeper">أنا بنام</button>
        <button class="tab" data-role="friend">أنا المنبّه</button>
      </div>

      <label>رمز الغرفة</label>
      <div class="room-row">
        <input id="room" maxlength="12" placeholder="مثال: DREAM7" autocomplete="off">
        <button id="join">دخول</button>
      </div>

      <div id="sleeperPanel">
        <div class="status" id="sleepStatus">
          <span class="dot"></span>
          <span>لم تدخل وضع النوم بعد</span>
        </div>
        <button class="sleep-btn" id="sleepBtn">
          <span>دخول وضع النوم</span>
          <small>سيتم تفعيل المنبّه لهذا الجهاز فقط</small>
        </button>
        <button class="wake-btn hidden" id="wakeBtn">أنا صحيت</button>
      </div>

      <div id="friendPanel" class="hidden">
        <div class="status" id="friendStatus">
          <span class="dot"></span>
          <span>بانتظار صاحب وضع النوم...</span>
        </div>
        <button class="alarm-btn" id="alarmBtn" disabled>
          <span class="alarm-icon">◉</span>
          <span>المنبّه</span>
          <small>اضغط لإيقاظه</small>
        </button>
      </div>

      <div id="voicePanel" class="voice-panel hidden">
        <div class="voice-title">غرفة الصوت</div>
        <div id="micStatus">المايك غير مجهز</div>
        <button id="prepareMic">تجهيز المايك</button>
        <audio id="remoteAudio" autoplay></audio>
      </div>
      <p class="hint">بعد 5 ضغطات يبدأ المنبّه. إذا لم يستيقظ خلال 30 ثانية، تبدأ غرفة الصوت بعد إعطاء المتصفح إذن المايك.</p>
    </section>
  </main>

  <div id="alarmOverlay" class="alarm-overlay hidden">
    <div class="alarm-inner">
      <div class="pulse"></div>
      <div class="alarm-kicker">WAKE UP</div>
      <h2>اصحــــى!</h2>
      <p>صديقك فعّل المنبّه.</p>
      <button id="stopAlarm">إيقاف المنبّه</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
